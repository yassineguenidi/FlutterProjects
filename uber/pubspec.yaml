name: uber
description: A new Flutter project.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
 
  cupertino_icons: ^0.1.3
  firebase_core: ^0.5.0+1
  firebase_auth: ^0.18.1+2
  firebase_database: ^4.1.1
  firebase_storage: ^4.0.0
  fluttertoast: ^7.1.1
  google_maps_flutter: ^1.0.3
  geolocator: ^6.1.1
  http: ^0.12.2
  provider: ^4.3.2+2
  font_awesome_flutter: ^8.10.0
  animated_text_kit: ^2.5.4
  flutter_polyline_points: ^0.2.4
  flutter_geofire: ^1.0.3
  url_launcher: ^5.7.10 
  smooth_star_rating: ^1.1.1
  intl: ^0.16.1
  flutter_launcher_icons: ^0.7.0
  firebase_messaging: ^7.0.3
  
  maps_toolkit: ^1.1.0+2
  image_picker: ^0.5.3+1
  permission_handler: ^5.0.1+1
  assets_audio_player: ^2.0.9
  

dev_dependencies:
  flutter_test:
    sdk: flutter
flutter_icons:
  android: true
  ios: true
  image_path: images/uber.png
  
flutter:

  uses-material-design: true

  assets:
     - images/car_android.png
     - images/car_ios.png
     - images/desticon.png
     - images/desticon1.png
     - images/logo.png
     - images/logo1.png
     - images/pickicon.png
     - images/posimarker.png
     - images/redmarker.png
     - images/taxi.png
     - images/user_icon.png
     - images/bike.png
     - images/ubergo.png
     - images/uberx.png
     - images/user.png
     - images/user2.png
     - images/driver.png
     - images/driver2.png
     - images/uberlogo.png
     - images/uber.png
     - images/im1.png
     - images/im2.png
     - images/im3.png
     - images/im4.png
     - images/im5.png
     - images/im6.png
     - images/uberb.jpg
     - sounds/alert.mp3



  

  fonts:
    - family: Signatra
      fonts:
        - asset: fonts/Signatra.ttf

    - family: Brand-Regular
      fonts:
        - asset: fonts/bolt-regular.ttf  

    - family: Brand Bold
      fonts:
        - asset: fonts/bolt-semibold.ttf    

